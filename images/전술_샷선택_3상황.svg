<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker>
  </defs>
  <rect width="960" height="580" fill="#fff"/>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#222">상대 위치에 따른 정석 샷 선택 (위에서 본 코트, 앞벽은 위쪽)</text>

  <!-- ===== court template drawn 3 times ===== -->
  <g id="c1">
    <rect x="45" y="110" width="230" height="351" fill="#fbf7ef" stroke="#9aa4ae" stroke-width="2"/>
    <rect x="45" y="104" width="230" height="7" fill="#9aa4ae"/>
    <line x1="45" y1="306" x2="275" y2="306" stroke="#c9a96e" stroke-width="2"/>
    <line x1="160" y1="306" x2="160" y2="461" stroke="#c9a96e" stroke-width="2"/>
    <rect x="45" y="306" width="58" height="58" fill="none" stroke="#c9a96e" stroke-width="2"/>
    <rect x="217" y="306" width="58" height="58" fill="none" stroke="#c9a96e" stroke-width="2"/>
  </g>
  <use href="#c1" x="320"/>
  <use href="#c1" x="640"/>

  <!-- ===== Panel 1 : opponent back ===== -->
  <text x="160" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#222">① 상대가 뒤쪽에 있을 때</text>
  <text x="160" y="88" text-anchor="middle" font-size="13" fill="#555">→ 앞으로 보내 가장 긴 거리를 뛰게</text>
  <!-- opponent run -->
  <line x1="80" y1="418" x2="248" y2="170" stroke="#e8590c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#o)"/>
  <text x="232" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#e8590c">상대 : 대각선</text><text x="232" y="436" text-anchor="middle" font-size="12" font-weight="700" fill="#e8590c">최장 거리 이동</text>
  <!-- primary: cross drop to front-right -->
  <polyline points="160,326 250,111 262,152" fill="none" stroke="#2f9e44" stroke-width="4" marker-end="url(#g)"/>
  <!-- secondary: straight drop front-left -->
  <polyline points="160,326 72,111 60,150" fill="none" stroke="#2f9e44" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#g)"/>
  <circle cx="160" cy="326" r="13" fill="#1f6feb"/><text x="160" y="331" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">나</text>
  <circle cx="73" cy="431" r="13" fill="#e8590c"/><text x="73" y="436" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">상대</text>
  <text x="160" y="486" text-anchor="middle" font-size="13" font-weight="700" fill="#2b8a3e">드롭 · 킬 · 공격적 보스트</text>
  <text x="160" y="504" text-anchor="middle" font-size="12" fill="#444">상대에게서 먼 앞 코너가 1순위</text>

  <!-- ===== Panel 2 : opponent front ===== -->
  <text x="480" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#222">② 상대가 앞쪽에 있을 때</text>
  <text x="480" y="88" text-anchor="middle" font-size="13" fill="#555">→ 뒤로 보내 몸을 돌려 뛰게</text>
  <line x1="552" y1="168" x2="392" y2="415" stroke="#e8590c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#o)"/>
  <!-- primary: cross lob/drive to back-left -->
  <polyline points="480,316 432,111 372,448" fill="none" stroke="#2f9e44" stroke-width="4" marker-end="url(#g)"/>
  <!-- secondary: straight length right -->
  <polyline points="480,316 586,111 588,448" fill="none" stroke="#2f9e44" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#g)"/>
  <circle cx="480" cy="316" r="13" fill="#1f6feb"/><text x="480" y="321" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">나</text>
  <circle cx="565" cy="155" r="13" fill="#e8590c"/><text x="565" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">상대</text>
  <text x="480" y="486" text-anchor="middle" font-size="13" font-weight="700" fill="#2b8a3e">크로스 로브 · 드라이브 (길이)</text>
  <text x="480" y="504" text-anchor="middle" font-size="12" fill="#444">상대 반대편 뒤 코너가 1순위</text>

  <!-- ===== Panel 3 : opponent on T ===== -->
  <text x="800" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#222">③ 상대가 T(중간)에 있을 때</text>
  <text x="800" y="88" text-anchor="middle" font-size="13" fill="#555">→ 타이트한 길이로 T에서 밀어내기</text>
  <!-- reach circle -->
  <circle cx="800" cy="306" r="56" fill="#fff4ec" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="828" y="380" text-anchor="middle" font-size="11" fill="#e8590c">발리 도달 범위</text>
  <!-- bad: loose cross through middle -->
  <polyline points="890,431 800,111 745,400" fill="none" stroke="#e03131" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#r)"/>
  <g transform="translate(763,306)"><line x1="-7" y1="-7" x2="7" y2="7" stroke="#e03131" stroke-width="3.5"/><line x1="-7" y1="7" x2="7" y2="-7" stroke="#e03131" stroke-width="3.5"/></g>
  <!-- primary: tight straight drive -->
  <polyline points="890,431 906,111 911,452" fill="none" stroke="#2f9e44" stroke-width="4" marker-end="url(#g)"/>
  <!-- secondary: wide cross lob hitting side wall behind opponent -->
  <polyline points="890,431 792,111 686,372 704,452" fill="none" stroke="#2f9e44" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#g)"/>
  <circle cx="686" cy="372" r="4" fill="#2f9e44"/>
  <circle cx="800" cy="306" r="13" fill="#e8590c"/><text x="800" y="311" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">상대</text>
  <circle cx="890" cy="431" r="13" fill="#1f6feb"/><text x="890" y="436" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">나</text>
  <text x="800" y="486" text-anchor="middle" font-size="13" font-weight="700" fill="#2b8a3e">타이트 스트레이트 · 넓은 크로스</text>
  <text x="800" y="504" text-anchor="middle" font-size="12" fill="#444">가운데로 새는 크로스는 금지</text>

  <!-- legend -->
  <g font-size="12" fill="#333">
    <rect x="30" y="524" width="900" height="44" rx="8" fill="#f8f9fa" stroke="#ccc"/>
    <line x1="50" y1="546" x2="86" y2="546" stroke="#2f9e44" stroke-width="4"/><text x="94" y="550">정석 1순위</text>
    <line x1="180" y1="546" x2="216" y2="546" stroke="#2f9e44" stroke-width="2.5" stroke-dasharray="8 5"/><text x="224" y="550">대안</text>
    <line x1="280" y1="546" x2="316" y2="546" stroke="#e03131" stroke-width="2.5" stroke-dasharray="6 5"/><text x="324" y="550">피해야 할 샷</text>
    <line x1="430" y1="546" x2="466" y2="546" stroke="#e8590c" stroke-width="2.5" stroke-dasharray="7 5"/><text x="474" y="550">상대의 이동</text>
    <text x="580" y="550">공 경로 = 치는 사람 → 앞벽 → 떨어지는 곳 · 오른손잡이 기준</text>
  </g>
</svg>
