<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="sf2-a" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker>
  </defs>
  <rect width="960" height="600" fill="#fff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#222">간섭이 있을 때의 판정 흐름 (나 = 공을 칠 차례인 선수)</text>

  <rect x="360" y="56" width="240" height="40" rx="20" fill="#343a40"/>
  <text x="480" y="81" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">경기를 멈추고 렛 요청</text>

  <g stroke="#495057" stroke-width="2" fill="none" marker-end="url(#sf2-a)">
    <line x1="480" y1="96" x2="480" y2="120"/>
    <line x1="480" y1="186" x2="480" y2="214"/>
    <line x1="480" y1="280" x2="480" y2="308"/>
    <line x1="480" y1="374" x2="480" y2="402"/>
    <line x1="480" y1="468" x2="480" y2="500"/>
    <line x1="660" y1="153" x2="706" y2="153"/>
    <line x1="660" y1="247" x2="706" y2="247"/>
    <line x1="660" y1="341" x2="706" y2="341"/>
    <line x1="660" y1="435" x2="706" y2="435"/>
  </g>
  <g font-size="12" font-weight="700" fill="#495057">
    <text x="490" y="205">예</text><text x="490" y="299">예</text><text x="490" y="393">예</text><text x="490" y="490">아니오</text>
    <text x="668" y="145">아니오</text><text x="668" y="239">아니오</text><text x="668" y="333">아니오</text><text x="676" y="427">예</text>
  </g>

  <g font-size="14" text-anchor="middle" fill="#212529">
    <rect x="300" y="120" width="360" height="66" rx="10" fill="#fff" stroke="#868e96" stroke-width="1.5"/>
    <text x="480" y="148" font-weight="700">① 실제로 간섭이 있었고,</text>
    <text x="480" y="170" font-weight="700">그 영향이 아주 작지 않았는가?</text>
    <rect x="300" y="214" width="360" height="66" rx="10" fill="#fff" stroke="#868e96" stroke-width="1.5"/>
    <text x="480" y="242" font-weight="700">② 간섭이 없었다면 좋은 리턴을</text>
    <text x="480" y="264" font-weight="700">칠 수 있었고, 그렇게 하려 했는가?</text>
    <rect x="300" y="308" width="360" height="66" rx="10" fill="#fff" stroke="#868e96" stroke-width="1.5"/>
    <text x="480" y="336" font-weight="700">③ 상대가 간섭을 피하려고</text>
    <text x="480" y="358" font-weight="700">모든 노력을 했는가?</text>
    <rect x="300" y="402" width="360" height="66" rx="10" fill="#fff" stroke="#868e96" stroke-width="1.5"/>
    <text x="480" y="430" font-weight="700">④ 간섭이 없었다면</text>
    <text x="480" y="452" font-weight="700">위너를 칠 수 있었는가?</text>
  </g>

  <g text-anchor="middle">
    <rect x="710" y="126" width="220" height="54" rx="10" fill="#f1f3f5" stroke="#868e96"/>
    <text x="820" y="149" font-size="15" font-weight="700" fill="#495057">노 렛 · 상대 점수</text>
    <text x="820" y="169" font-size="12" fill="#666">간섭이 없거나 아주 작음</text>
    <rect x="710" y="220" width="220" height="54" rx="10" fill="#f1f3f5" stroke="#868e96"/>
    <text x="820" y="243" font-size="15" font-weight="700" fill="#495057">노 렛 · 상대 점수</text>
    <text x="820" y="263" font-size="12" fill="#666">어차피 닿지 못했을 공</text>
    <rect x="710" y="314" width="220" height="54" rx="10" fill="#d3f9d8" stroke="#2f9e44"/>
    <text x="820" y="337" font-size="15" font-weight="700" fill="#2b8a3e">스트로크 · 내 점수</text>
    <text x="820" y="357" font-size="12" fill="#444">상대가 비켜 주지 않음</text>
    <rect x="710" y="408" width="220" height="54" rx="10" fill="#d3f9d8" stroke="#2f9e44"/>
    <text x="820" y="431" font-size="15" font-weight="700" fill="#2b8a3e">스트로크 · 내 점수</text>
    <text x="820" y="451" font-size="12" fill="#444">위너 기회를 막음</text>
    <rect x="370" y="500" width="220" height="54" rx="10" fill="#d0ebff" stroke="#1c7ed6"/>
    <text x="480" y="523" font-size="15" font-weight="700" fill="#1864ab">렛 · 랠리를 다시</text>
    <text x="480" y="543" font-size="12" fill="#444">상대도 비키려 했고, 나도 칠 수 있었음</text>
  </g>

  <g font-size="12" fill="#555">
    <text x="30" y="150" font-weight="700" fill="#343a40">노 렛이 되는 흔한 경우</text>
    <text x="30" y="172">· 공에 닿을 수 없었음</text>
    <text x="30" y="192">· 내가 돌아가는 길을 택해</text>
    <text x="40" y="210">스스로 간섭을 만듦</text>
    <text x="30" y="230">· 간섭을 받아들이고 계속</text>
    <text x="40" y="248">친 뒤에 요청함</text>
    <text x="30" y="268">· 지나치게 큰 스윙</text>
  </g>
  <text x="480" y="584" text-anchor="middle" font-size="12" fill="#666">원리를 단순화한 흐름이다. 실제 판정은 심판의 판단과 최신 WSF 규칙을 따른다</text>
</svg>