<text x="248" y="570" text-anchor="middle" font-size="12" fill="#555">어깨 뒤쪽·등 위쪽 근육이 고무줄처럼 늘어나 있음</text>
<text x="720" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#222">② 임팩트</text>
