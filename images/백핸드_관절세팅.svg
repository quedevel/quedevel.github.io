<rect x="510" y="532" width="436" height="48" rx="8" fill="#f8f9fa" stroke="#dee2e6"/>
<text x="728" y="552" text-anchor="middle" font-size="12.5" font-weight="700" fill="#333">몸통은 거의 옆을 본 채 멈추고, 그 기세로 팔이 튀어 나감</text>
<text x="728" y="570" text-anchor="middle" font-size="12" fill="#555">골반은 15~30° 정도 앞벽 쪽으로 열림</text>
