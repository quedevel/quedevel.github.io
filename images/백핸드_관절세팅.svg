<text x="600.1" y="328" text-anchor="end" font-size="12" font-weight="700" fill="#333">앞발보다</text>
<text x="600.1" y="344" text-anchor="end" font-size="12" font-weight="700" fill="#333">20~40 cm 앞</text>
<text x="744.1" y="278.2" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1c7ed6">팔꿈치 160~175°</text>
<line x1="793.9" y1="403.6" x2="894" y2="435.2" stroke="#adb5bd" stroke-width="8" stroke-linecap="round"/>
<text x="853.9" y="465.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#495057">반대 팔은 뒤로 → 몸통 멈춤</text>
<text x="852" y="320" font-size="12.5" font-weight="700" fill="#e8590c">어깨선은</text>
