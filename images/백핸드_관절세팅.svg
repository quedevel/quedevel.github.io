<text x="226" y="268" text-anchor="end" font-size="13" font-weight="700" fill="#e8590c">어깨선 30~45° 더 돎</text>
<text x="226" y="286" text-anchor="end" font-size="11.5" fill="#e8590c">(등이 앞벽 쪽으로 살짝 보임)</text>
<text x="346" y="348" font-size="12.5" font-weight="700" fill="#495057">골반은 0~15°</text>
<text x="210.3" y="423.7" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f9e44">팔꿈치 90~110°</text>
<text x="210.3" y="441.7" text-anchor="middle" font-size="12" fill="#2f9e44">가슴 앞을 가로지름</text>
<text x="406.6" y="507.2" text-anchor="middle" font-size="12" fill="#343a40">라켓 머리는 위·뒤</text>
<text x="406.6" y="523.2" text-anchor="middle" font-size="12" fill="#868e96">반대 손이 목을 받침</text>
