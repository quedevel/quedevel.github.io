<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<defs><marker id="gp1-o" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker><marker id="gp1-k" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect width="960" height="540" fill="#fff"/>
<text x="480" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#222">정석 그립 : V자는 왼쪽 모서리, 검지는 띄워서 받친다</text>
<line x1="470" y1="58" x2="470" y2="520" stroke="#dee2e6" stroke-width="1.5" stroke-linecap="round"/>
<text x="235" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#222">① 손잡이 끝에서 본 단면 (오른손잡이)</text>
<line x1="235" y1="108" x2="235" y2="462" stroke="#ced4da" stroke-width="6" stroke-linecap="round"/>
<text x="245" y="108" font-size="11.5" fill="#868e96">라켓 면</text>
<polygon points="189.8,181 280.2,181 344,244.8 344,335.2 280.2,399 189.8,399 126,335.2 126,244.8" fill="#f1f3f5" stroke="#495057" stroke-width="2.5"/>
<circle cx="235" cy="198" r="12" fill="#fff" stroke="#adb5bd"/>
<text x="235" y="202.5" text-anchor="middle" font-size="12" font-weight="700" fill="#495057">1</text>
<circle cx="300.1" cy="224.9" r="12" fill="#fff" stroke="#adb5bd"/>
<text x="300.1" y="229.4" text-anchor="middle" font-size="12" font-weight="700" fill="#495057">2</text>
<circle cx="327" cy="290" r="12" fill="#fff" stroke="#adb5bd"/>
<text x="327" y="294.5" text-anchor="middle" font-size="12" font-weight="700" fill="#495057">3</text>
<circle cx="300.1" cy="355.1" r="12" fill="#fff" stroke="#adb5bd"/>
<text x="300.1" y="359.6" text-anchor="middle" font-size="12" font-weight="700" fill="#495057">4</text>
<circle cx="235" cy="382" r="12" fill="#fff" stroke="#adb5bd"/>
<text x="235" y="386.5" text-anchor="middle" font-size="12" font-weight="700" fill="#495057">5</text>
<circle cx="169.9" cy="355.1" r="12" fill="#fff" stroke="#adb5bd"/>
<text x="169.9" y="359.6" text-anchor="middle" font-size="12" font-weight="700" fill="#495057">6</text>
<circle cx="143" cy="290" r="12" fill="#fff" stroke="#adb5bd"/>
<text x="143" y="294.5" text-anchor="middle" font-size="12" font-weight="700" fill="#495057">7</text>
<circle cx="169.9" cy="224.9" r="12" fill="#fff" stroke="#adb5bd"/>
<text x="169.9" y="229.4" text-anchor="middle" font-size="12" font-weight="700" fill="#495057">8</text>
<path d="M219,151 L235,175 L251,151" fill="none" stroke="#adb5bd" stroke-width="4" stroke-dasharray="5 4" stroke-linejoin="round"/>
<text x="257" y="147" font-size="11.5" fill="#868e96">망치 그립의 V</text>
<path d="M186.9,137.8 L186,171.7 L161.3,148.4" fill="none" stroke="#e8590c" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="142" y="131.7" text-anchor="end" font-size="14" font-weight="700" fill="#e8590c">정석 V자</text>
<text x="142" y="149.7" text-anchor="end" font-size="12" fill="#e8590c">8번과 1번 사이 모서리</text>
<path d="M235,230 A60,60 0 0 0 212,234.6" fill="none" stroke="#7048e8" stroke-width="2.5"/>
<line x1="235" y1="290" x2="196.7" y2="197.6" stroke="#7048e8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<line x1="235" y1="290" x2="235" y2="190" stroke="#7048e8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="181" y="264" text-anchor="middle" font-size="12" font-weight="700" fill="#7048e8">반 면 ≈ 22.5°</text>
<circle cx="331.2" cy="193.8" r="11" fill="#1c7ed6"/>
<text x="347.2" y="183.8" font-size="12" font-weight="700" fill="#1c7ed6">검지 뿌리 마디</text>
<text x="347.2" y="199.8" font-size="12" fill="#1c7ed6">= 2번 면</text>
<path d="M103,300 A132,132 0 0 1 141.7,196.7" fill="none" stroke="#f59f00" stroke-width="9" stroke-linecap="round" opacity=".85"/>
<text x="93" y="294" text-anchor="end" font-size="12" font-weight="700" fill="#b35c00">엄지·엄지 두덩</text>
<text x="93" y="310" text-anchor="end" font-size="12" fill="#b35c00">(7~8번 면)</text>
<path d="M359,335.1 A132,132 0 0 1 120.7,356" fill="none" stroke="#2f9e44" stroke-width="9" stroke-linecap="round" opacity=".85"/>
<text x="295" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="#2f9e44">중지·약지·새끼 : 4~6번 면을 감아 쥠</text>
<text x="235" y="506" text-anchor="middle" font-size="11.5" fill="#868e96">면 번호 : 손잡이 끝에서 볼 때 윗면이 1번, 시계 방향으로 2~8번</text>
<text x="715" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#222">② 옆에서 본 손 모양</text>
<rect x="520" y="248" width="400" height="44" rx="14" fill="#e9ecef" stroke="#868e96" stroke-width="2"/>
<rect x="512" y="244" width="18" height="52" rx="6" fill="#adb5bd"/>
<text x="512" y="236" font-size="11.5" fill="#868e96">손잡이 끝</text>
<text x="918" y="238" text-anchor="end" font-size="11.5" fill="#868e96">라켓 머리 쪽 →</text>
<ellipse cx="560" cy="274" rx="34" ry="44" fill="#ffe8cc" stroke="#e8590c" stroke-width="1.5" opacity=".75"/>
<rect x="586" y="230" width="24" height="96" rx="12" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
<rect x="616" y="230" width="24" height="96" rx="12" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
<rect x="646" y="230" width="24" height="96" rx="12" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
<text x="628" y="354" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f9e44">새끼·약지·중지</text>
<text x="628" y="370" text-anchor="middle" font-size="12" fill="#2f9e44">붙여서 감아 쥠 = 당기는 쪽</text>
<line x1="672" y1="218" x2="712" y2="218" stroke="#7048e8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#gp1-k)" marker-start="url(#gp1-k)"/>
<text x="692" y="210" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7048e8">1~2 cm 띄움</text>
<path d="M716,230 C724,262 748,292 770,308" fill="none" stroke="#1c7ed6" stroke-width="22" stroke-linecap="round" opacity=".9"/>
<circle cx="770" cy="308" r="5" fill="#fff"/>
<text x="790" y="310" font-size="12.5" font-weight="700" fill="#1c7ed6">검지 : 방아쇠처럼 뻗어</text>
<text x="790" y="326" font-size="12" fill="#1c7ed6">손잡이를 받치는 받침점</text>
<path d="M600,200 C640,210 676,234 700,262" fill="none" stroke="#f59f00" stroke-width="20" stroke-linecap="round" opacity=".85"/>
<text x="590" y="186" font-size="12.5" font-weight="700" fill="#b35c00">엄지 : 중지 쪽으로 감싸 V자를 만듦</text>
<text x="560" y="210" font-size="13" fill="#333"></text>
<text x="520" y="400" font-size="12" fill="#c2410c">새끼 두덩(주황 타원) : 손잡이 끝을 손바닥 아래에 묻어 두는 자리</text>
<rect x="500" y="424" width="440" height="58" rx="8" fill="#e7f5ff" stroke="#74c0fc"/>
<text x="720" y="448" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1864ab">손잡이는 손바닥 가운데가 아니라 손가락 뿌리를 따라 비스듬히</text>
<text x="720" y="468" text-anchor="middle" font-size="12.5" fill="#1864ab">→ 손목을 꺾고 아래팔을 비틀 여유가 남는다</text>
</svg>
