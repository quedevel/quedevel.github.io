<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/>
    </marker>
    <marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#868e96"/>
    </marker>
    <marker id="chain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#fff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#222">정석 드라이브의 라켓 헤드 궤적 (측면도, 포핸드)</text>
  <line x1="800" y1="58" x2="900" y2="58" stroke="#495057" stroke-width="2.5" marker-end="url(#chain)"/>
  <text x="790" y="63" text-anchor="end" font-size="14" fill="#495057">앞벽 방향</text>

  <!-- downswing -->
  <path d="M150,100 C160,280 300,320 470,320" fill="none" stroke="#1f6feb" stroke-width="5" marker-mid="url(#blue)"/>
  <!-- follow-through -->
  <path d="M470,320 C620,320 740,280 820,150" fill="none" stroke="#868e96" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#gray)"/>
  <!-- arrow on downswing -->
  <path d="M236,270 L262,282" stroke="#1f6feb" stroke-width="5" marker-end="url(#blue)"/>

  <!-- racket at peak -->
  <ellipse cx="150" cy="96" rx="15" ry="24" fill="#e7f0ff" stroke="#1f6feb" stroke-width="3"/>
  <line x1="150" y1="120" x2="150" y2="160" stroke="#1f6feb" stroke-width="5" stroke-linecap="round"/>
  <!-- racket at impact (slightly open face) -->
  <ellipse cx="466" cy="320" rx="6" ry="26" transform="rotate(-15 466 320)" fill="#e7f0ff" stroke="#1f6feb" stroke-width="3"/>
  <line x1="454" y1="336" x2="410" y2="346" stroke="#1f6feb" stroke-width="5" stroke-linecap="round"/>
  <!-- ball -->
  <circle cx="490" cy="316" r="11" fill="#2b2b2b"/>
  <circle cx="494" cy="312" r="2.2" fill="#f4c20d"/>

  <!-- labels -->
  <g>
    <circle cx="186" cy="84" r="13" fill="#1f6feb"/>
    <text x="186" y="89" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
    <text x="206" y="82" font-size="15" font-weight="700" fill="#222">백스윙 정점</text>
    <text x="206" y="102" font-size="13" fill="#444">라켓 헤드는 머리 높이 이상, 손목은 세운 상태(L자)</text>
    <text x="206" y="120" font-size="13" fill="#444">크게 뒤로 돌리기보다 "높이와 각도"를 준비</text>
  </g>
  <g>
    <text x="70" y="300" font-size="15" font-weight="700" fill="#1f6feb">다운스윙</text>
    <text x="70" y="320" font-size="13" fill="#444">위에서 아래로 내려오며 가속</text>
  </g>
  <g>
    <circle cx="380" cy="384" r="13" fill="#1f6feb"/>
    <text x="380" y="389" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
    <text x="400" y="382" font-size="15" font-weight="700" fill="#222">임팩트</text>
    <text x="400" y="400" font-size="13" fill="#444">궤적의 가장 낮고 수평에 가까운 구간 · 진행 방향은 수평 ~ 약간 아래 · 면은 약간 열림</text>
  </g>
  <g>
    <circle cx="560" cy="160" r="13" fill="#868e96"/>
    <text x="560" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
    <text x="580" y="158" font-size="15" font-weight="700" fill="#222">팔로우스루</text>
    <text x="580" y="178" font-size="13" fill="#444">목표 방향으로 길게 뻗은 뒤</text>
    <text x="580" y="196" font-size="13" fill="#444">어깨 높이에서 컴팩트하게 마무리</text>
  </g>

  <!-- kinetic chain -->
  <text x="480" y="432" text-anchor="middle" font-size="14" font-weight="700" fill="#222">운동 사슬 : 몸 중심에서 끝으로 속도가 차례로 넘어감 (손목은 꺾지 않고 각도를 유지)</text>
  <g font-size="13" text-anchor="middle">
    <rect x="20" y="446" width="160" height="40" rx="6" fill="#f1f3f5" stroke="#adb5bd"/>
    <text x="100" y="471" fill="#222">하체 · 몸통 회전</text>
    <line x1="182" y1="466" x2="208" y2="466" stroke="#495057" stroke-width="2.5" marker-end="url(#chain)"/>
    <rect x="210" y="446" width="160" height="40" rx="6" fill="#e7f5ff" stroke="#74c0fc"/>
    <text x="290" y="471" fill="#222">어깨 · 팔꿈치 선행</text>
    <line x1="372" y1="466" x2="398" y2="466" stroke="#495057" stroke-width="2.5" marker-end="url(#chain)"/>
    <rect x="400" y="446" width="160" height="40" rx="6" fill="#d0ebff" stroke="#4dabf7"/>
    <text x="480" y="471" fill="#222">팔꿈치 펴짐</text>
    <line x1="562" y1="466" x2="588" y2="466" stroke="#495057" stroke-width="2.5" marker-end="url(#chain)"/>
    <rect x="590" y="446" width="160" height="40" rx="6" fill="#a5d8ff" stroke="#339af0"/>
    <text x="670" y="465" fill="#222">전완 회전</text>
    <text x="670" y="481" font-size="11" fill="#333">(포: 회내 / 백: 회외)</text>
    <line x1="752" y1="466" x2="778" y2="466" stroke="#495057" stroke-width="2.5" marker-end="url(#chain)"/>
    <rect x="780" y="446" width="160" height="40" rx="6" fill="#1f6feb" stroke="#1864ab"/>
    <text x="860" y="471" font-weight="700" fill="#fff">라켓 헤드 최고속</text>
  </g>
</svg>
