<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="sz1-o" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker>
  </defs>
  <rect width="960" height="560" fill="#fff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#222">코트 구역 지도 : 공의 위치가 선택지를 정한다 (앞벽은 위쪽)</text>

  <rect x="60" y="70" width="294" height="449" fill="#fbf7ef" stroke="#9aa4ae" stroke-width="2"/>
  <rect x="60" y="63" width="294" height="7" fill="#9aa4ae"/>
  <line x1="60" y1="320" x2="354" y2="320" stroke="#c9a96e" stroke-width="2"/>
  <line x1="207" y1="320" x2="207" y2="519" stroke="#c9a96e" stroke-width="2"/>
  <rect x="60" y="320" width="74" height="74" fill="none" stroke="#c9a96e" stroke-width="2"/>
  <rect x="280" y="320" width="74" height="74" fill="none" stroke="#c9a96e" stroke-width="2"/>

  <!-- zone 2 : middle near side wall -->
  <rect x="61" y="240" width="64" height="150" fill="#f59f00" opacity=".22"/>
  <rect x="289" y="240" width="64" height="150" fill="#f59f00" opacity=".22"/>
  <!-- zone 1 : tight strips -->
  <rect x="61" y="71" width="12" height="447" fill="#12b886" opacity=".5"/>
  <rect x="341" y="71" width="12" height="447" fill="#12b886" opacity=".5"/>
  <!-- zone 4 : intercept -->
  <ellipse cx="207" cy="316" rx="80" ry="54" fill="#1f6feb" opacity=".07" stroke="#1f6feb" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- zone 3 : body -->
  <circle cx="207" cy="320" r="27" fill="#e64980" opacity=".2" stroke="#e64980" stroke-width="1.5"/>

  <!-- loose cross -->
  <polyline points="110,470 200,72 322,500" fill="none" stroke="#e8590c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#sz1-o)"/>
  <circle cx="110" cy="470" r="13" fill="#e8590c"/><text x="110" y="475" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">상대</text>
  <circle cx="207" cy="320" r="13" fill="#1f6feb"/><text x="207" y="325" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">나</text>

  <g font-size="12" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="88" cy="140" r="11" fill="#0ca678"/><text x="88" y="144.5">1</text>
    <circle cx="326" cy="140" r="11" fill="#0ca678"/><text x="326" y="144.5">1</text>
    <circle cx="96" cy="262" r="11" fill="#e67700"/><text x="96" y="266.5">2</text>
    <circle cx="318" cy="262" r="11" fill="#e67700"/><text x="318" y="266.5">2</text>
    <circle cx="207" cy="279" r="11" fill="#d6336c"/><text x="207" y="283.5">3</text>
    <circle cx="172" cy="352" r="11" fill="#1f6feb"/><text x="172" y="356.5">4</text>
  </g>
  <text x="207" y="546" text-anchor="middle" font-size="12" fill="#c2410c">주황 점선 : T 근처를 지나는 넓지 않은 크로스</text>

  <!-- cards -->
  <g font-size="13" fill="#444">
    <rect x="400" y="70" width="530" height="100" rx="10" fill="#f8f9fa" stroke="#dee2e6"/>
    <rect x="400" y="70" width="6" height="100" rx="3" fill="#0ca678"/>
    <circle cx="432" cy="98" r="12" fill="#0ca678"/><text x="432" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
    <text x="454" y="104" font-size="16" font-weight="700" fill="#087f5b">타이트 볼 · 사이드월에 붙은 공</text>
    <text x="454" y="130">공의 벽 쪽 면을 칠 수 없다 → 선택지는 사실상 스트레이트</text>
    <text x="454" y="152">짧은 스윙으로 높고 깊게 빠져나온다</text>

    <rect x="400" y="182" width="530" height="100" rx="10" fill="#f8f9fa" stroke="#dee2e6"/>
    <rect x="400" y="182" width="6" height="100" rx="3" fill="#e67700"/>
    <circle cx="432" cy="210" r="12" fill="#e67700"/><text x="432" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
    <text x="454" y="216" font-size="16" font-weight="700" fill="#d9480f">미들 코트 사이드월 근처의 공</text>
    <text x="454" y="242">T와 가깝고 높이가 애매하다 → 공격과 길이의 갈림길</text>
    <text x="454" y="264">높이와 무게중심으로 고르고, 애매하면 스트레이트 길이</text>

    <rect x="400" y="294" width="530" height="100" rx="10" fill="#f8f9fa" stroke="#dee2e6"/>
    <rect x="400" y="294" width="6" height="100" rx="3" fill="#d6336c"/>
    <circle cx="432" cy="322" r="12" fill="#d6336c"/><text x="432" y="327" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
    <text x="454" y="328" font-size="16" font-weight="700" fill="#c2255c">바디 볼 · 몸쪽으로 오는 공</text>
    <text x="454" y="354">스윙할 공간이 없다 → 공간부터 만든다</text>
    <text x="454" y="376">옆으로 반 걸음, 짧은 블록, 기본은 백핸드</text>

    <rect x="400" y="406" width="530" height="100" rx="10" fill="#f8f9fa" stroke="#dee2e6"/>
    <rect x="400" y="406" width="6" height="100" rx="3" fill="#1f6feb"/>
    <circle cx="432" cy="434" r="12" fill="#1f6feb"/><text x="432" y="439" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
    <text x="454" y="440" font-size="16" font-weight="700" fill="#1864ab">인터셉트 · 넓지 않은 크로스</text>
    <text x="454" y="466">상대 크로스가 T 근처를 지난다 → 발리로 끊는다</text>
    <text x="454" y="488">상대가 있는 쪽의 반대, 상대에게서 가장 먼 코너로</text>
  </g>
</svg>