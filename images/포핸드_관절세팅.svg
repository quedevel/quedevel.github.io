<circle cx="198" cy="290" r="11" fill="#1c7ed6"/><text x="198" y="294.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
<circle cx="370" cy="296" r="11" fill="#2f9e44"/><text x="370" y="300.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
<circle cx="374" cy="110" r="11" fill="#f59f00"/><text x="374" y="114.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
</g>
<rect x="28" y="518" width="456" height="80" rx="8" fill="#f8f9fa" stroke="#dee2e6"/>
<circle cx="46" cy="534" r="8" fill="#1c7ed6"/><text x="46" y="538" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text>
<text x="62" y="538" font-size="12.5" fill="#333">어깨 : 옆으로 60~90° 벌림 · 뒤로 젖힘 60~90° (내려올 때 90~120°)</text>
<circle cx="46" cy="556" r="8" fill="#2f9e44"/><text x="46" y="560" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text>
<text x="62" y="560" font-size="12.5" fill="#333">팔꿈치 : 굽힘 ≈ 80~100° · 높이는 어깨와 같거나 약간 아래</text>
<circle cx="46" cy="578" r="8" fill="#f59f00"/><text x="46" y="582" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text>
<text x="62" y="582" font-size="12.5" fill="#333">손목 : 손등 쪽 30~45° + 엄지 쪽 15~25° → 아래팔–라켓 ≈ 90~120°</text>
<text x="732" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#222">② 왜 굽혀야 하나 : 팔을 감아 돌릴 때의 지렛대</text>
<text x="540" y="104" font-size="14" font-weight="700" fill="#2f9e44">팔꿈치 ≈ 90°</text>
<line x1="550" y1="220" x2="790" y2="220" stroke="#868e96" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="792" y="238" font-size="11.5" fill="#868e96">위팔 = 회전축</text>
<ellipse cx="730" cy="220" rx="18" ry="92" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M748,214 A18,92 0 0 1 742,284" fill="none" stroke="#e8590c" stroke-width="2.5" marker-end="url(#fh1-o)"/>
<line x1="580" y1="220" x2="730" y2="220" stroke="#1c7ed6" stroke-width="13" stroke-linecap="round"/>
<line x1="730" y1="220" x2="730" y2="128" stroke="#2f9e44" stroke-width="11" stroke-linecap="round"/>
