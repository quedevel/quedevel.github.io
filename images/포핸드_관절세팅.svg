<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<defs><marker id="fh1-k" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker><marker id="fh1-o" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker></defs>
<rect width="960" height="610" fill="#fff"/>
<text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#222">백스윙 정점 : 관절 각도가 곧 지렛대</text>
<line x1="505" y1="60" x2="505" y2="590" stroke="#dee2e6" stroke-width="1.5"/>
<text x="250" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#222">① 백스윙 정점 (뒤에서 본 오른팔)</text>
<g transform="translate(0,60)">
<circle cx="118" cy="196" r="30" fill="#e9ecef" stroke="#adb5bd" stroke-width="2"/>
