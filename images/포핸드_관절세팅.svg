<line x1="740" y1="128" x2="740" y2="214" stroke="#e8590c" stroke-width="1.5"/>
<text x="748" y="160" font-size="12.5" font-weight="700" fill="#e8590c">반경 = 아래팔 길이</text>
<text x="780" y="130" font-size="12.5" fill="#333">→ 손이 큰 호를 그림</text>
<text x="780" y="180" font-size="12.5" font-weight="700" fill="#333">→ 라켓 머리 속도 ↑</text>
<text x="540" y="352" font-size="14" font-weight="700" fill="#e03131">팔꿈치 완전히 폄</text>
<line x1="550" y1="400" x2="935" y2="400" stroke="#868e96" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="580" y1="400" x2="720" y2="400" stroke="#1c7ed6" stroke-width="13" stroke-linecap="round"/>
<line x1="720" y1="400" x2="830" y2="400" stroke="#2f9e44" stroke-width="11" stroke-linecap="round"/>
<line x1="830" y1="400" x2="920" y2="400" stroke="#343a40" stroke-width="6" stroke-linecap="round"/>
<circle cx="580" cy="400" r="8" fill="#495057"/>
<ellipse cx="875" cy="400" rx="7" ry="16" fill="none" stroke="#e8590c" stroke-width="2.5"/>
<text x="640" y="444" font-size="12.5" font-weight="700" fill="#e03131">반경 ≈ 0 → 라켓이 제자리에서 비틀림</text>
<text x="640" y="464" font-size="12.5" fill="#333">→ 면만 돌고 라켓 머리 속도는 그대로</text>
<rect x="530" y="486" width="404" height="44" rx="8" fill="#fff4e6" stroke="#f59f00"/>
<text x="732" y="513" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a4a00">세운 손목 = 아래팔 비틀기의 지렛대 (반경 ≈ 0.35~0.45 m)</text>
</svg>
