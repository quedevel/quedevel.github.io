<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="sd1-r" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker>
    <marker id="sd1-g" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker>
    <marker id="sd1-b" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c7ed6"/></marker>
  </defs>
  <rect width="960" height="580" fill="#fff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#222">드라이브의 타깃 : 어디에, 어떤 높이로</text>

  <!-- panel A : top view -->
  <text x="240" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#222">① 위에서 본 타깃 존</text>
  <text x="240" y="88" text-anchor="middle" font-size="13" fill="#555">앞벽은 위쪽 · 직선 드라이브 기준</text>
  <rect x="125" y="110" width="230" height="351" fill="#fbf7ef"/>
  <rect x="125" y="111" width="230" height="195" fill="#ffe3e3"/>
  <rect x="125" y="306" width="230" height="155" fill="#fff3bf"/>
  <rect x="125" y="335" width="36" height="90" fill="#b2f2bb"/>
  <rect x="319" y="335" width="36" height="90" fill="#b2f2bb"/>
  <rect x="125" y="335" width="9" height="90" fill="#2f9e44"/>
  <rect x="346" y="335" width="9" height="90" fill="#2f9e44"/>
  <rect x="125" y="110" width="230" height="351" fill="none" stroke="#9aa4ae" stroke-width="2"/>
  <rect x="125" y="104" width="230" height="7" fill="#9aa4ae"/>
  <line x1="125" y1="306" x2="355" y2="306" stroke="#c9a96e" stroke-width="2"/>
  <line x1="240" y1="306" x2="240" y2="461" stroke="#c9a96e" stroke-width="2"/>
  <rect x="125" y="306" width="58" height="58" fill="none" stroke="#c9a96e" stroke-width="2"/>
  <rect x="297" y="306" width="58" height="58" fill="none" stroke="#c9a96e" stroke-width="2"/>
  <text x="240" y="205" text-anchor="middle" font-size="15" font-weight="700" fill="#c92a2a">0점</text>
  <text x="240" y="225" text-anchor="middle" font-size="12" fill="#c92a2a">숏 라인 앞</text>
  <text x="200" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#946800">1점</text>
  <text x="280" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#946800">1점</text>
  <text x="148" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#2b8a3e">2</text>
  <text x="332" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#2b8a3e">2</text>
  <line x1="150" y1="112" x2="131" y2="372" stroke="#495057" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="131" cy="374" r="5" fill="#fff" stroke="#495057" stroke-width="2"/>
  <g font-size="12" fill="#444">
    <rect x="96" y="486" width="14" height="14" fill="#2f9e44"/><text x="116" y="498"><tspan font-weight="700">3점</tspan> A존 + 사이드월 25cm 이내</text>
    <rect x="96" y="508" width="14" height="14" fill="#b2f2bb" stroke="#69db7c"/><text x="116" y="520"><tspan font-weight="700">2점</tspan> A존 (박스 뒤쪽 절반 ~ 뒤벽 1m 앞, 벽에서 1m)</text>
    <rect x="96" y="530" width="14" height="14" fill="#fff3bf" stroke="#ffd43b"/><text x="116" y="542"><tspan font-weight="700">1점</tspan> 숏 라인 뒤, A존 밖</text>
    <rect x="96" y="552" width="14" height="14" fill="#ffe3e3" stroke="#ffa8a8"/><text x="116" y="564"><tspan font-weight="700">0점</tspan> 숏 라인 앞 · 하프 라인 넘음 · 뒤벽 맞고 튀어나옴</text>
  </g>

  <!-- panel B : side view -->
  <text x="730" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#222">② 옆에서 본 높이 3단계</text>
  <text x="730" y="88" text-anchor="middle" font-size="13" fill="#555">높이와 속도를 바꿔도 떨어지는 곳은 같은 A존</text>
  <rect x="528" y="262" width="12" height="178" fill="#adb5bd"/>
  <rect x="920" y="357" width="12" height="83" fill="#adb5bd"/>
  <rect x="540" y="421" width="6" height="19" fill="#e03131"/>
  <line x1="528" y1="440" x2="932" y2="440" stroke="#495057" stroke-width="3"/>
  <rect x="783" y="440" width="98" height="8" fill="#2f9e44" opacity=".8"/>
  <line x1="752" y1="440" x2="752" y2="450" stroke="#495057" stroke-width="2"/>
  <line x1="815" y1="440" x2="815" y2="450" stroke="#495057" stroke-width="2"/>
  <line x1="540" y1="371" x2="552" y2="371" stroke="#495057" stroke-width="2"/>
  <g font-size="12" text-anchor="end">
    <text x="520" y="355" font-weight="700" fill="#1864ab">플로트 · +50cm</text>
    <text x="520" y="375" font-weight="700" fill="#2b8a3e">기본 · 서비스 라인</text>
    <text x="520" y="394" font-weight="700" fill="#c92a2a">하드 · −40cm</text>
    <text x="520" y="434" fill="#868e96">틴</text>
  </g>
  <path d="M540,351 Q640,236 838,440" fill="none" stroke="#1c7ed6" stroke-width="3" marker-end="url(#sd1-b)"/>
  <path d="M540,371 Q660,330 812,440" fill="none" stroke="#2f9e44" stroke-width="3" marker-end="url(#sd1-g)"/>
  <path d="M540,386 Q660,396 790,440" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#sd1-r)"/>
  <path d="M838,440 Q884,406 920,428" fill="none" stroke="#1c7ed6" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M812,440 Q868,408 920,430" fill="none" stroke="#2f9e44" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M790,440 Q852,414 920,432" fill="none" stroke="#e03131" stroke-width="2" stroke-dasharray="4 4"/>
  <g font-size="12" fill="#495057" text-anchor="middle">
    <text x="534" y="466">앞벽</text>
    <text x="752" y="466">숏 라인</text>
    <text x="832" y="466" font-weight="700" fill="#2b8a3e">A존</text>
    <text x="926" y="466">뒤벽</text>
  </g>
  <rect x="540" y="492" width="390" height="70" rx="10" fill="#f8f9fa" stroke="#dee2e6"/>
  <g font-size="13" fill="#444" text-anchor="middle">
    <text x="735" y="518">높이 ↑ 속도 ↓ / 높이 ↓ 속도 ↑ : <tspan font-weight="700">길이는 같게</tspan></text>
    <text x="735" y="543" font-size="12" fill="#555">두 번째 바운스는 뒤벽 바로 앞, 또는 뒤벽에 낮게 닿고 죽는다</text>
  </g>
</svg>
