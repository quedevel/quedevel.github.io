<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="sv3-g" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker>
    <marker id="sv3-o" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker>
    <marker id="sv3-r" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker>
    <marker id="sv3-b" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker>
  </defs>
  <rect width="960" height="580" fill="#fff"/>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#222">리턴 선택지 (위에서 본 코트, 앞벽은 위쪽 · 나 = 리시버)</text>

  <g id="sv3-c1">
    <rect x="45" y="110" width="230" height="351" fill="#fbf7ef" stroke="#9aa4ae" stroke-width="2"/>
    <rect x="45" y="104" width="230" height="7" fill="#9aa4ae"/>
    <line x1="45" y1="306" x2="275" y2="306" stroke="#c9a96e" stroke-width="2"/>
    <line x1="160" y1="306" x2="160" y2="461" stroke="#c9a96e" stroke-width="2"/>
    <rect x="45" y="306" width="58" height="58" fill="none" stroke="#c9a96e" stroke-width="2"/>
    <rect x="217" y="306" width="58" height="58" fill="none" stroke="#c9a96e" stroke-width="2"/>
  </g>
  <use href="#sv3-c1" x="320"/>
  <use href="#sv3-c1" x="640"/>

  <!-- Panel 1 : standard -->
  <text x="160" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#222">① 정석 리턴</text>
  <text x="160" y="88" text-anchor="middle" font-size="13" fill="#555">→ 서버를 T에서 뒤로 밀어낸다</text>
  <polyline points="82,418 70,111 60,452" fill="none" stroke="#2f9e44" stroke-width="4" marker-end="url(#sv3-g)"/>
  <polyline points="82,418 190,111 262,448" fill="none" stroke="#2f9e44" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#sv3-g)"/>
  <line x1="150" y1="318" x2="92" y2="430" stroke="#e8590c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#sv3-o)"/>
  <line x1="94" y1="408" x2="146" y2="334" stroke="#1f6feb" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#sv3-b)"/>
  <circle cx="82" cy="425" r="13" fill="#1f6feb"/><text x="82" y="430" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">나</text>
  <circle cx="165" cy="312" r="13" fill="#e8590c"/><text x="165" y="317" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">서버</text>
  <text x="160" y="486" text-anchor="middle" font-size="13" font-weight="700" fill="#2b8a3e">스트레이트 드라이브 · 롭 (실선)</text>
  <text x="160" y="504" text-anchor="middle" font-size="12" fill="#444">넓은 크로스 롭 (점선)</text>

  <!-- Panel 2 : conditional attack -->
  <text x="480" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#222">② 조건부 공격 리턴</text>
  <text x="480" y="88" text-anchor="middle" font-size="13" fill="#555">→ 서브가 느슨하고 서버가 T에 늦을 때만</text>
  <polyline points="418,362 382,111 374,150" fill="none" stroke="#2f9e44" stroke-width="4" marker-end="url(#sv3-g)"/>
  <line x1="545" y1="335" x2="404" y2="170" stroke="#e8590c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#sv3-o)"/>
  <circle cx="418" cy="370" r="13" fill="#1f6feb"/><text x="418" y="375" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">나</text>
  <circle cx="556" cy="342" r="13" fill="#e8590c"/><text x="556" y="347" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">서버</text>
  <text x="566" y="380" text-anchor="middle" font-size="11" font-weight="700" fill="#e8590c">아직 박스 근처</text>
  <text x="480" y="486" text-anchor="middle" font-size="13" font-weight="700" fill="#2b8a3e">발리 드롭 · 발리 킬</text>
  <text x="480" y="504" text-anchor="middle" font-size="12" fill="#444">짧고 느슨한 서브를 앞에서 끊어 먼 앞 코너로</text>

  <!-- Panel 3 : avoid -->
  <text x="800" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#222">③ 피해야 할 리턴</text>
  <text x="800" y="88" text-anchor="middle" font-size="13" fill="#555">→ T에 있는 서버에게 공격 기회</text>
  <polyline points="722,418 806,111 850,330" fill="none" stroke="#e03131" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#sv3-r)"/>
  <polyline points="722,418 686,360 880,111 902,160" fill="none" stroke="#e03131" stroke-width="2.5" stroke-dasharray="3 5" marker-end="url(#sv3-r)"/>
  <circle cx="805" cy="312" r="34" fill="#e8590c" opacity=".08" stroke="#e8590c" stroke-dasharray="4 4"/>
  <text x="836" y="284" font-size="18" font-weight="700" fill="#e03131">✕</text>
  <circle cx="722" cy="425" r="13" fill="#1f6feb"/><text x="722" y="430" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">나</text>
  <circle cx="805" cy="312" r="13" fill="#e8590c"/><text x="805" y="317" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">서버</text>
  <text x="800" y="486" text-anchor="middle" font-size="13" font-weight="700" fill="#c92a2a">가운데로 새는 크로스 · 수비적 보스트</text>
  <text x="800" y="504" text-anchor="middle" font-size="12" fill="#444">서버가 T에서 한 걸음 만에 공격</text>

  <!-- legend -->
  <g font-size="12" fill="#444">
    <rect x="150" y="530" width="660" height="34" rx="8" fill="#f8f9fa" stroke="#dee2e6"/>
    <line x1="168" y1="547" x2="198" y2="547" stroke="#2f9e44" stroke-width="4"/><text x="206" y="551">정석 1순위</text>
    <line x1="290" y1="547" x2="320" y2="547" stroke="#2f9e44" stroke-width="2.5" stroke-dasharray="8 5"/><text x="328" y="551">대안</text>
    <line x1="380" y1="547" x2="410" y2="547" stroke="#e03131" stroke-width="2.5" stroke-dasharray="7 5"/><text x="418" y="551">피해야 할 샷</text>
    <line x1="520" y1="547" x2="550" y2="547" stroke="#1f6feb" stroke-width="2.5" stroke-dasharray="7 5"/><text x="558" y="551">나의 이동</text>
    <line x1="640" y1="547" x2="670" y2="547" stroke="#e8590c" stroke-width="2.5" stroke-dasharray="7 5"/><text x="678" y="551">서버의 이동</text>
  </g>
</svg>
