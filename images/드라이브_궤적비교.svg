<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="arrPro" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/>
    </marker>
    <marker id="arrAm" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <!-- title -->
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#222">같은 바운드 지점, 전혀 다른 두 궤적 (측면도)</text>

  <!-- court: front wall, back wall, floor -->
  <rect x="60" y="70" width="14" height="330" fill="#9aa4ae"/>
  <rect x="866" y="70" width="14" height="330" fill="#9aa4ae"/>
  <rect x="60" y="400" width="820" height="12" fill="#9aa4ae"/>
  <text x="67" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#333">앞벽</text>
  <text x="873" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#333">백월</text>
  <text x="470" y="432" text-anchor="middle" font-size="14" fill="#555">바닥</text>

  <!-- AMATEUR trajectory (orange) -->
  <!-- from front wall high, high arc, steep descent -->
  <path d="M74,160 Q330,40 560,400" fill="none" stroke="#e8590c" stroke-width="3.5"/>
  <!-- after bounce: small hop, dies -->
  <path d="M560,400 Q592,352 624,400" fill="none" stroke="#e8590c" stroke-width="3.5"/>
  <path d="M624,400 Q642,382 660,400" fill="none" stroke="#e8590c" stroke-width="3" stroke-dasharray="6 4"/>
  <circle cx="74" cy="160" r="6" fill="#e8590c"/>
  <!-- dies marker -->
  <g transform="translate(676,384)">
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="#e8590c" stroke-width="3"/>
    <line x1="-7" y1="7" x2="7" y2="-7" stroke="#e8590c" stroke-width="3"/>
  </g>
  <line x1="676" y1="374" x2="668" y2="318" stroke="#e8590c" stroke-width="1.5"/><text x="668" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#e8590c">백월 전에 죽음</text>

  <!-- PRO trajectory (blue) -->
  <!-- from front wall lower, fast and flat -->
  <path d="M74,290 Q330,280 560,400" fill="none" stroke="#1f6feb" stroke-width="3.5"/>
  <!-- after bounce: skids low to back wall -->
  <path d="M560,400 Q720,350 866,364" fill="none" stroke="#1f6feb" stroke-width="3.5"/>
  <!-- rebound off back wall -->
  <path d="M866,364 Q835,360 806,398" fill="none" stroke="#1f6feb" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrPro)"/>
  <circle cx="74" cy="290" r="6" fill="#1f6feb"/>
  <circle cx="866" cy="364" r="6" fill="#1f6feb"/>
  <text x="770" y="440" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6feb">백월까지 뻗어 맞고 나옴</text>

  <!-- curve labels -->
  <rect x="210" y="74" width="232" height="50" rx="6" fill="#fff4ec" stroke="#e8590c"/>
  <text x="326" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#e8590c">동호인 드라이브</text>
  <text x="326" y="115" text-anchor="middle" font-size="13" fill="#7a3a12">느리고 높게 → 바닥을 가파르게 찍음</text>

  <rect x="150" y="196" width="232" height="50" rx="6" fill="#eef4ff" stroke="#1f6feb"/>
  <text x="266" y="217" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6feb">프로 드라이브</text>
  <text x="266" y="237" text-anchor="middle" font-size="13" fill="#123a7a">빠르고 낮게 → 바닥을 얕게 스침</text>

  <!-- front wall hit labels -->
  <text x="86" y="182" font-size="12" fill="#e8590c">앞벽 높은 곳</text>
  <text x="86" y="314" font-size="12" fill="#1f6feb">앞벽 낮은 곳</text>

  <!-- bounce point -->
  <circle cx="560" cy="400" r="7" fill="#222"/>
  <line x1="560" y1="440" x2="560" y2="414" stroke="#555" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <text x="560" y="458" text-anchor="middle" font-size="14" font-weight="700" fill="#222">비슷한 바운드 지점</text>

  <!-- INSET: velocity components at floor contact -->
  <g transform="translate(560,92)">
    <rect x="0" y="0" width="290" height="190" rx="8" fill="#fafafa" stroke="#bbb"/>
    <text x="145" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#222">바닥에 닿는 순간의 속도 성분</text>

    <!-- pro -->
    <text x="18" y="52" font-size="13" font-weight="700" fill="#1f6feb">프로</text>
    <line x1="30" y1="72" x2="150" y2="72" stroke="#1f6feb" stroke-width="4" marker-end="url(#arrPro)"/>
    <line x1="30" y1="72" x2="30" y2="102" stroke="#1f6feb" stroke-width="4" marker-end="url(#arrPro)"/>
    <text x="160" y="70" font-size="12" fill="#333">수평: 크다</text>
    <text x="160" y="86" font-size="12" fill="#333">수직: 작다</text>
    <text x="160" y="102" font-size="12" fill="#333">입사각: 얕다</text>

    <!-- amateur -->
    <text x="18" y="128" font-size="13" font-weight="700" fill="#e8590c">동호인</text>
    <line x1="30" y1="140" x2="70" y2="140" stroke="#e8590c" stroke-width="4" marker-end="url(#arrAm)"/>
    <line x1="30" y1="140" x2="30" y2="182" stroke="#e8590c" stroke-width="4" marker-end="url(#arrAm)"/>
    <text x="160" y="142" font-size="12" fill="#333">수평: 작다</text>
    <text x="160" y="158" font-size="12" fill="#333">수직: 크다</text>
    <text x="160" y="174" font-size="12" fill="#333">입사각: 가파르다</text>
  </g>

  <!-- footer -->
  <text x="480" y="500" text-anchor="middle" font-size="13" fill="#555">수직 성분은 낮은 반발력 때문에 바운드에서 대부분 죽고, 수평 성분은 마찰로 일부만 잃고 남는다 → 수평 속도가 큰 공만 백월까지 간다</text>
</svg>
