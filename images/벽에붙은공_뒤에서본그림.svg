<text x="430" y="364.5" text-anchor="end" font-size="12.5" font-weight="700" fill="#c92a2a">✕ 라켓이 벽에 먼저 닿음</text>
<text x="430" y="380.5" text-anchor="end" font-size="11.5" fill="#c92a2a">(라켓 머리가 벽 속 10~20 cm)</text>
<text x="394.8" y="288.8" font-size="12" font-weight="700" fill="#1864ab">팔꿈치가 접혀 몸쪽으로</text>
<text x="394.8" y="304.8" font-size="12" fill="#1864ab">말림 (닭 날개 모양)</text>
<line x1="392.8" y1="300.8" x2="370.8" y2="334.8" stroke="#1c7ed6" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="436.8" cy="430" r="7" fill="#f5a623" stroke="#fff" stroke-width="1.5"/>
<text x="426.8" y="456" text-anchor="end" font-size="11.5" font-weight="700" fill="#b35c00">벽에 붙은 공</text>
<text x="720" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#2f9e44">② 한 뼘 떨어져, 라켓을 세워 수직으로</text>
<rect x="920" y="118" width="14" height="352" fill="#adb5bd"/>
<text x="927" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#495057">옆벽</text>
<line x1="520" y1="470" x2="934" y2="470" stroke="#495057" stroke-width="3" stroke-linecap="round"/>
