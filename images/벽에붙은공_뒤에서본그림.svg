<line x1="904" y1="348.4" x2="904" y2="409.2" stroke="#343a40" stroke-width="6" stroke-linecap="round"/>
<ellipse cx="904" cy="430" rx="15.2" ry="20" fill="#f1f3f5" stroke="#343a40" stroke-width="3"/>
<line x1="904" y1="358" x2="931.2" y2="385.2" stroke="#e03131" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="881.6" y="390" text-anchor="end" font-size="11.5" font-weight="700" fill="#c92a2a">코킹이 풀리면 라켓 끝이</text>
<text x="881.6" y="405" text-anchor="end" font-size="11.5" fill="#c92a2a">벽 쪽으로 (빨간 점선)</text>
<path d="M894.4,158 L896,278 Q900.8,398 905.6,454 Q910.4,398 910.4,318" fill="none" stroke="#e8590c" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#tb1-o)"/>
<text x="862.8" y="146.8" text-anchor="end" font-size="12.5" font-weight="700" fill="#e8590c">벽과 나란한 수직 V자 길</text>
<text x="862.8" y="162.8" text-anchor="end" font-size="12" fill="#e8590c">위 → 아래 → 공 밑 → 위</text>
<circle cx="904" cy="358" r="6" fill="#f59f00"/>
<text x="834" y="354" text-anchor="end" font-size="12" font-weight="700" fill="#b35c00">손목은 세운 채</text>
<text x="834" y="370" text-anchor="end" font-size="11.5" fill="#b35c00">(아래팔–라켓 약 135°)</text>
<line x1="838" y1="358" x2="896" y2="358" stroke="#f59f00" stroke-width="1.2" stroke-linecap="round"/>
<text x="813.2" y="438.8" text-anchor="end" font-size="12" fill="#495057">무릎·엉덩이를 깊게 낮춤</text>
<circle cx="916.8" cy="430" r="7" fill="#f5a623" stroke="#fff" stroke-width="1.5"/>
<text x="906.8" y="456" text-anchor="end" font-size="11.5" font-weight="700" fill="#b35c00">벽에 붙은 공</text>
<rect x="30" y="500" width="900" height="64" rx="8" fill="#f8f9fa" stroke="#dee2e6"/>
<text x="480" y="524" text-anchor="middle" font-size="12.5" fill="#333">공 중심은 벽에서 2 cm. 라켓 테두리 바깥에서 줄까지는 약 1~1.5 cm → 라켓의 긴 옆 테두리를 벽과 나란히 세우면 줄 가장자리로 공을 맞힐 수 있다</text>
<text x="480" y="546" text-anchor="middle" font-size="11.5" fill="#868e96">몸을 그림 크기 그대로 그린 것은 아니다. 거리와 각도는 대표값</text>
</svg>
