<defs><marker id="tb1-o" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker><marker id="tb1-k" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker><marker id="tb1-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs>
<rect width="960" height="580" fill="#fff"/>
<text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#222">뒤에서 본 그림 : 공이 벽에 붙을수록 몸은 떨어지고, 라켓은 세운다</text>
<line x1="480" y1="52" x2="480" y2="560" stroke="#dee2e6" stroke-width="1.5" stroke-linecap="round"/>
<text x="240" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#e03131">① 평소처럼 서서 수평으로 휘두름</text>
<rect x="440" y="118" width="14" height="352" fill="#adb5bd"/>
<text x="447" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#495057">옆벽</text>
<line x1="40" y1="470" x2="454" y2="470" stroke="#495057" stroke-width="3" stroke-linecap="round"/>
<line x1="395.2" y1="190" x2="438" y2="190" stroke="#e03131" stroke-width="1.8" stroke-linecap="round" marker-start="url(#tb1-r)" marker-end="url(#tb1-r)"/>
<text x="411.6" y="182" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c92a2a">약 25 cm</text>
<line x1="376" y1="342" x2="387.2" y2="399.6" stroke="#adb5bd" stroke-width="13" stroke-linecap="round"/>
