<text x="846.8" y="195" text-anchor="end" font-size="12.5" font-weight="700" fill="#2b8a3e">스윙 통로 약 45 cm</text>
<line x1="820.8" y1="354.8" x2="843.2" y2="402.8" stroke="#adb5bd" stroke-width="13" stroke-linecap="round"/>
