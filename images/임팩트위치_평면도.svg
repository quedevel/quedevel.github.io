<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/>
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#fff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#222">스트레이트 드라이브의 임팩트 위치 (위에서 본 그림, 오른손잡이)</text>

  <!-- ===== Forehand panel ===== -->
  <g>
    <text x="240" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#222">포핸드 (코트 오른쪽)</text>
    <!-- court -->
    <rect x="30" y="80" width="420" height="300" fill="#fbf7ef" stroke="#9aa4ae" stroke-width="2"/>
    <rect x="30" y="80" width="420" height="12" fill="#9aa4ae"/>
    <text x="240" y="90" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">앞벽</text>
    <rect x="438" y="80" width="12" height="300" fill="#9aa4ae"/>
    <text x="430" y="370" text-anchor="end" font-size="12" fill="#868e96">옆벽 →</text>

    <!-- front foot reference -->
    <line x1="40" y1="232" x2="430" y2="232" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="44" y="226" font-size="11" fill="#868e96">앞발 위치 기준선</text>

    <!-- feet: front (left) foot, back (right) foot -->
    <ellipse cx="200" cy="232" rx="11" ry="22" transform="rotate(50 200 232)" fill="#495057"/>
    <text x="222" y="258" font-size="11" fill="#495057">앞발(왼발)</text>
    <ellipse cx="150" cy="322" rx="11" ry="22" transform="rotate(70 150 322)" fill="#868e96"/>
    <text x="150" y="354" text-anchor="middle" font-size="11" fill="#495057">뒷발(오른발)</text>
    <!-- body -->
    <ellipse cx="172" cy="278" rx="16" ry="40" transform="rotate(-10 172 278)" fill="#dee2e6" stroke="#868e96"/>
    <circle cx="172" cy="278" r="12" fill="#adb5bd"/>
    <!-- arm + racket -->
    <line x1="180" y1="250" x2="300" y2="216" stroke="#495057" stroke-width="5" stroke-linecap="round"/>
    <line x1="300" y1="216" x2="318" y2="213" stroke="#1f6feb" stroke-width="4"/>
    <!-- racket face parallel to front wall -->
    <line x1="296" y1="210" x2="368" y2="210" stroke="#1f6feb" stroke-width="6" stroke-linecap="round"/>
    <!-- ball -->
    <circle cx="332" cy="196" r="10" fill="#2b2b2b"/>
    <!-- direction to front wall -->
    <line x1="332" y1="182" x2="332" y2="108" stroke="#1f6feb" stroke-width="3" marker-end="url(#up)"/>
    <text x="342" y="130" font-size="12" fill="#1f6feb">앞벽 정면으로</text>
    <!-- ahead offset dimension -->
    <line x1="392" y1="200" x2="392" y2="228" stroke="#e8590c" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <text x="398" y="208" font-size="11" fill="#e8590c">약간</text>
    <text x="398" y="222" font-size="11" fill="#e8590c">앞</text>
    <!-- labels -->
    <text x="240" y="300" font-size="13" font-weight="700" fill="#222">타점 : 앞발 옆 ~ 약간 앞</text>
    <text x="240" y="318" font-size="12" fill="#444">팔이 거의 펴지되 잠기지 않는 거리</text>
    <text x="240" y="336" font-size="12" fill="#444">몸통 회전이 앞벽을 향하는 순간</text>
  </g>

  <!-- ===== Backhand panel ===== -->
  <g>
    <text x="720" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#222">백핸드 (코트 왼쪽)</text>
    <rect x="510" y="80" width="420" height="300" fill="#fbf7ef" stroke="#9aa4ae" stroke-width="2"/>
    <rect x="510" y="80" width="420" height="12" fill="#9aa4ae"/>
    <text x="720" y="90" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">앞벽</text>
    <rect x="510" y="80" width="12" height="300" fill="#9aa4ae"/>
    <text x="530" y="370" font-size="12" fill="#868e96">← 옆벽</text>

    <line x1="530" y1="232" x2="920" y2="232" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="916" y="226" text-anchor="end" font-size="11" fill="#868e96">앞발 위치 기준선</text>

    <!-- feet: front (right) foot, back (left) foot -->
    <ellipse cx="760" cy="232" rx="11" ry="22" transform="rotate(-50 760 232)" fill="#495057"/>
    <text x="738" y="258" text-anchor="end" font-size="11" fill="#495057">앞발(오른발)</text>
    <ellipse cx="810" cy="322" rx="11" ry="22" transform="rotate(-70 810 322)" fill="#868e96"/>
    <text x="810" y="354" text-anchor="middle" font-size="11" fill="#495057">뒷발(왼발)</text>
    <ellipse cx="788" cy="278" rx="16" ry="40" transform="rotate(10 788 278)" fill="#dee2e6" stroke="#868e96"/>
    <circle cx="788" cy="278" r="12" fill="#adb5bd"/>
    <!-- arm + racket -->
    <line x1="778" y1="248" x2="660" y2="184" stroke="#495057" stroke-width="5" stroke-linecap="round"/>
    <line x1="660" y1="184" x2="644" y2="180" stroke="#1f6feb" stroke-width="4"/>
    <line x1="596" y1="178" x2="668" y2="178" stroke="#1f6feb" stroke-width="6" stroke-linecap="round"/>
    <circle cx="630" cy="164" r="10" fill="#2b2b2b"/>
    <line x1="630" y1="150" x2="630" y2="108" stroke="#1f6feb" stroke-width="3" marker-end="url(#up)"/>
    <text x="640" y="128" font-size="12" fill="#1f6feb">앞벽 정면으로</text>
    <line x1="570" y1="168" x2="570" y2="228" stroke="#e8590c" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <text x="548" y="196" text-anchor="middle" font-size="11" fill="#e8590c">더</text>
    <text x="548" y="210" text-anchor="middle" font-size="11" fill="#e8590c">앞</text>
    <text x="560" y="300" font-size="13" font-weight="700" fill="#222">타점 : 앞발보다 더 앞</text>
    <text x="560" y="318" font-size="12" fill="#444">팔이 몸을 가로질러 나오는 구조라</text>
    <text x="560" y="336" font-size="12" fill="#444">어깨가 앞에 있는 만큼 타점도 앞으로</text>
  </g>

  <!-- footer -->
  <rect x="30" y="398" width="900" height="56" rx="8" fill="#f8f9fa" stroke="#ccc"/>
  <text x="480" y="420" text-anchor="middle" font-size="13" fill="#333"><tspan font-weight="700" fill="#1f6feb">파란 막대 = 라켓 면</tspan> : 임팩트 순간 앞벽을 정면으로 바라보는(옆벽과 평행한) 위치가 이상적인 타점</text>
  <text x="480" y="442" text-anchor="middle" font-size="13" fill="#333">타점이 뒤에 있으면 공이 옆벽 쪽으로 새거나 뜨고, 너무 앞에 있으면 크로스로 꺾이거나 낮게 박힌다</text>
</svg>
