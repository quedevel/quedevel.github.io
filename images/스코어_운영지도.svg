  <g font-size="12" fill="#444">
    <rect x="590" y="96" width="22" height="22" rx="4" fill="#e7f5ff" stroke="#74c0fc"/>
    <text x="622" y="113" font-size="15" font-weight="700" fill="#1864ab">탐색 (둘 다 0~4점)</text>
    <text x="622" y="136">상대 확인, 길이 위주, 질문하는 샷</text>
    <text x="622" y="154">몸과 공의 감각을 맞추는 구간</text>

    <rect x="590" y="180" width="22" height="22" rx="4" fill="#f3f0ff" stroke="#b197fc"/>
    <text x="622" y="197" font-size="15" font-weight="700" fill="#5f3dc4">중반 기본 운영</text>
    <text x="622" y="220">찾은 약점을 공략, 공격 문턱은 평소대로</text>
    <text x="622" y="238">4편의 랠리 패턴을 가장 많이 쓰는 구간</text>

    <rect x="590" y="264" width="22" height="22" rx="4" fill="#d3f9d8" stroke="#69db7c"/>
    <text x="622" y="281" font-size="15" font-weight="700" fill="#2b8a3e">굳히기 (3점 이상 앞섬)</text>
    <text x="622" y="304">이기고 있는 패턴을 그대로 유지</text>
    <text x="622" y="322">느슨해지는 것과 상대의 변화에 주의</text>

    <rect x="590" y="348" width="22" height="22" rx="4" fill="#ffdeeb" stroke="#f783ac"/>
    <text x="622" y="365" font-size="15" font-weight="700" fill="#c2255c">변화 (3점 이상 뒤짐)</text>
    <text x="622" y="388">지고 있는 패턴 하나를 바꿈</text>
    <text x="622" y="406">확률 낮은 샷을 늘리는 것과는 다름</text>

    <rect x="590" y="432" width="22" height="22" rx="4" fill="#ffe8cc" stroke="#ffa94d"/>
    <text x="622" y="449" font-size="15" font-weight="700" fill="#d9480f">종반 접전 (9점 이상, 2점 차 이내)</text>
    <text x="622" y="472">높은 확률의 샷, 스스로 내주는 점수 최소화</text>
    <text x="622" y="490">서브와 리턴을 가장 안전하게</text>
  </g>
  <text x="590" y="530" font-size="12" fill="#666">굵은 테두리 칸은 2-1에서 따로 설명하는 점수</text>
</svg>