  <line x1="240" y1="306" x2="240" y2="461" stroke="#c9a96e" stroke-width="2"/>
  <rect x="125" y="306" width="58" height="58" fill="none" stroke="#c9a96e" stroke-width="2"/>
  <rect x="297" y="306" width="58" height="58" fill="none" stroke="#c9a96e" stroke-width="2"/>
  <text x="139" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
  <text x="337" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
  <text x="168" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#2b8a3e">2</text>
  <text x="312" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#2b8a3e">2</text>
  <text x="240" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#946800">1점</text>
  <rect x="178" y="372" width="124" height="44" rx="6" fill="#ffe3e3"/>
  <text x="240" y="390" text-anchor="middle" font-size="15" font-weight="700" fill="#c92a2a">0점</text>
  <text x="240" y="410" text-anchor="middle" font-size="12" fill="#c92a2a">숏 라인을 넘어감</text>
  <polyline points="214,290 156,112 151,136" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="151" cy="138" r="5" fill="#fff" stroke="#495057" stroke-width="2"/>
  <circle cx="216" cy="296" r="11" fill="#1f6feb"/><text x="216" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">나</text>
  <g font-size="12" fill="#444">
    <rect x="96" y="486" width="14" height="14" fill="#2f9e44"/><text x="116" y="498"><tspan font-weight="700">3점</tspan> 앞 코너 1m × 1m (니크 포함)</text>
    <rect x="96" y="508" width="14" height="14" fill="#b2f2bb" stroke="#69db7c"/><text x="116" y="520"><tspan font-weight="700">2점</tspan> 앞벽 2m, 사이드월 1.6m 이내</text>
    <rect x="96" y="530" width="14" height="14" fill="#fff3bf" stroke="#ffd43b"/><text x="116" y="542"><tspan font-weight="700">1점</tspan> 숏 라인 앞, 위 구역 밖</text>
    <rect x="96" y="552" width="14" height="14" fill="#ffe3e3" stroke="#ffa8a8"/><text x="116" y="564"><tspan font-weight="700">0점</tspan> 숏 라인을 넘어감 · 높게 뜸 <tspan fill="#c92a2a">(틴 −1)</tspan></text>
  </g>

  <!-- panel B : side view -->
  <text x="730" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#222">② 목표 띠와 두 샷의 궤적 (옆에서)</text>
  <text x="730" y="88" text-anchor="middle" font-size="13" fill="#555">높이는 실제보다 약 2.5배 과장</text>
  <rect x="528" y="226" width="12" height="214" fill="#adb5bd"/>
  <rect x="540" y="392" width="6" height="48" fill="#e03131"/>
  <rect x="546" y="362" width="16" height="18" fill="#2f9e44" opacity=".45"/>
