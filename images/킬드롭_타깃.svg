  <line x1="546" y1="380" x2="600" y2="380" stroke="#2f9e44" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="540" y1="262" x2="552" y2="262" stroke="#495057" stroke-width="2"/>
  <line x1="528" y1="440" x2="930" y2="440" stroke="#495057" stroke-width="3"/>
  <line x1="752" y1="440" x2="752" y2="450" stroke="#495057" stroke-width="2"/>
  <line x1="815" y1="440" x2="815" y2="450" stroke="#495057" stroke-width="2"/>
  <g font-size="12" text-anchor="end">
    <text x="520" y="266" fill="#495057">서비스 라인</text>
    <text x="520" y="366" font-weight="700" fill="#2b8a3e">틴 위 30cm</text>
    <text x="520" y="384" font-weight="700" fill="#2b8a3e">틴 위 12cm (공 3개)</text>
    <text x="520" y="420" font-weight="700" fill="#c92a2a">틴 0.48m</text>
  </g>
  <line x1="752" y1="326" x2="564" y2="370" stroke="#adb5bd" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M736,300 Q640,280 564,374" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M562,371 Q584,404 606,440" fill="none" stroke="#e03131" stroke-width="3"/>
  <path d="M606,440 Q660,406 712,440" fill="none" stroke="#e03131" stroke-width="3" marker-end="url(#sk1-r)"/>
  <path d="M562,376 Q566,404 572,440" fill="none" stroke="#1c7ed6" stroke-width="3"/>
  <path d="M572,440 Q588,420 604,440" fill="none" stroke="#1c7ed6" stroke-width="3" marker-end="url(#sk1-b)"/>
  <circle cx="606" cy="440" r="4" fill="#e03131"/><circle cx="572" cy="440" r="4" fill="#1c7ed6"/>
  <g font-size="12" fill="#495057" text-anchor="middle">
    <text x="534" y="466">앞벽</text>
    <text x="752" y="466">숏 라인</text>
    <text x="815" y="466">박스 뒤</text>
  </g>
  <g font-size="12" fill="#444">
    <line x1="560" y1="494" x2="590" y2="494" stroke="#e03131" stroke-width="3"/><text x="598" y="498"><tspan font-weight="700" fill="#c92a2a">킬</tspan> : 빠르고 낮게, 두 번째 바운스가 숏 라인 앞</text>
    <line x1="560" y1="518" x2="590" y2="518" stroke="#1c7ed6" stroke-width="3"/><text x="598" y="522"><tspan font-weight="700" fill="#1864ab">드롭</tspan> : 느리고 짧게, 앞벽 바로 밑에서 두 번째 바운스</text>
    <line x1="560" y1="542" x2="590" y2="542" stroke="#adb5bd" stroke-width="2" stroke-dasharray="5 4"/><text x="598" y="546">T 근처에서 친 공이 앞벽으로 가는 길</text>
  </g>
  <rect x="560" y="560" width="370" height="30" rx="7" fill="#ebfbee" stroke="#b2f2bb"/>
  <text x="745" y="580" text-anchor="middle" font-size="13" fill="#2b8a3e">앞벽 접촉은 목표 띠 안 · 기회가 좋을수록 띠의 위쪽으로</text>
</svg>
