<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="sk1-r" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker>
    <marker id="sk1-b" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c7ed6"/></marker>
  </defs>
  <rect width="960" height="600" fill="#fff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#222">킬·드롭의 타깃 : 어디에 떨어뜨리고, 얼마나 낮게</text>

  <!-- panel A : drop zones -->
  <text x="240" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#222">① 드롭의 타깃 (위에서 본 코트)</text>
  <text x="240" y="88" text-anchor="middle" font-size="13" fill="#555">앞벽은 위쪽 · 첫 바운스 위치로 채점</text>
  <rect x="125" y="110" width="230" height="351" fill="#fbf7ef"/>
  <rect x="125" y="111" width="230" height="195" fill="#fff3bf"/>
  <rect x="125" y="306" width="230" height="155" fill="#ffe3e3"/>
  <rect x="125" y="111" width="58" height="72" fill="#b2f2bb"/>
  <rect x="297" y="111" width="58" height="72" fill="#b2f2bb"/>
  <rect x="125" y="111" width="36" height="36" fill="#2f9e44"/>
  <rect x="319" y="111" width="36" height="36" fill="#2f9e44"/>
  <rect x="125" y="110" width="230" height="351" fill="none" stroke="#9aa4ae" stroke-width="2"/>
  <rect x="125" y="104" width="230" height="7" fill="#9aa4ae"/>
